name: Voice Control Hosts
on:
  repository_dispatch:
    types: [block_now, bo_block]

jobs:
  execute_command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Logic
        run: |
          if [ "${{ github.event.action }}" == "bo_block" ]; then
            echo "" > hosts
            echo "" > game.txt
            cat Clear_windowname > windowsname
            cat Backup_tomrule_empty.json > tomrules.json
            cat Backup_browser_limit_empty.json > browser_limit.json
            cat unlock_pc_limit_time.json > pc_limit_time.json
            echo "STATUS=Đã bỏ Block" >> $GITHUB_ENV
          elif [ "${{ github.event.action }}" == "block_now" ]; then
            cat Backup_hosts > hosts
            cat Clear_game > game.txt
            cat Clear_windowname > windowsname
            cat Backup_tomrule_soft.json > tomrules.json
            cat Backup_browser_limit.json > browser_limit.json
            cat Backup_pc_limit_time.json > pc_limit_time.json
            echo "STATUS=Đã Block" >> $GITHUB_ENV
          fi

      - name: Commit changes
        run: |
          git config --global user.name "Claude AI"
          git config --global user.email "claude@ai.com"
          git add hosts game.txt windowsname tomrules.json browser_limit.json pc_limit_time.json
          git commit -m "${{ env.STATUS }}"
          git push
